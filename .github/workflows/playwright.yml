name: Playwright Login Page Tests

# ---------------------------------------------------------------------------
# When this pipeline runs
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]        # runs on every push to main
  pull_request:
    branches: [main]        # runs on every PR targeting main
  workflow_dispatch:         # allows manual runs from the Actions tab

jobs:
  test:
    name: Run Playwright tests against Flask app
    runs-on: ubuntu-latest   # GitHub's cloud Linux server

    steps:
      # -------------------------------------------------------------------
      # 1. Check out the repository code onto the runner
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2. Set up Python for the Flask app
      # -------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -------------------------------------------------------------------
      # 3. Install Flask app dependencies
      # -------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------------------
      # 4. Set up Node.js for Playwright
      # -------------------------------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------------------------------------------------
      # 5. Install Node dependencies (Playwright)
      # -------------------------------------------------------------------
      - name: Install Node dependencies
        run: npm ci

      # -------------------------------------------------------------------
      # 6. Install Playwright browsers (Chromium + system deps)
      # -------------------------------------------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # -------------------------------------------------------------------
      # 7. Start the Flask app in the background
      #    Wait until it responds before running tests
      # -------------------------------------------------------------------
      - name: Start Flask app
        run: |
          python login_app/app.py &
          echo "Waiting for Flask to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/login > /dev/null; then
              echo "Flask is up!"
              break
            fi
            sleep 1
          done

      # -------------------------------------------------------------------
      # 8. Run all Playwright tests
      #    continue-on-error lets the pipeline finish and upload the report
      #    even when tests fail (we have 3 intentional failures)
      # -------------------------------------------------------------------
      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      # -------------------------------------------------------------------
      # 9. Upload the HTML report as a downloadable artifact
      #    Always runs, even if tests failed
      # -------------------------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # -------------------------------------------------------------------
      # 10. Upload JUnit results (used later for TestRail push)
      # -------------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      # -------------------------------------------------------------------
      # 11. Push results to TestRail using trcli
      #     Reads the JUnit XML and pushes results to the project by name.
      #     --case-matcher name matches tests to cases by TITLE instead of
      #     the automation_id field (which TestRail stored as
      #     custom_case_automation_id and cannot be renamed).
      #     Credentials come from GitHub Secrets (never exposed in logs).
      #     always() ensures results are pushed even when tests failed.
      # -------------------------------------------------------------------
      - name: Push results to TestRail
        if: always()
        run: |
          pip install trcli
          trcli -y \
            -h "${{ secrets.TESTRAIL_HOST }}" \
            -u "${{ secrets.TESTRAIL_USER }}" \
            -k "${{ secrets.TESTRAIL_API_KEY }}" \
            --project "Login Page QA — Week 1 Practical" \
            --project-id 2 \
            parse_junit \
            --title "Automated Playwright Run - GitHub Actions" \
            --case-matcher name \
            --file "test-results/junit-results.xml"
