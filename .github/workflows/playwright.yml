name: Playwright Login Page Tests

# ---------------------------------------------------------------------------
# When this pipeline runs
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]        # runs on every push to main
  pull_request:
    branches: [main]        # runs on every PR targeting main
  workflow_dispatch:         # allows manual runs from the Actions tab

jobs:
  test:
    name: Run Playwright tests against Flask app
    runs-on: ubuntu-latest   # GitHub's cloud Linux server

    steps:
      # -------------------------------------------------------------------
      # 1. Check out the repository code onto the runner
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2. Set up Python for the Flask app
      # -------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -------------------------------------------------------------------
      # 3. Install Flask app dependencies
      # -------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------------------
      # 4. Set up Node.js for Playwright
      # -------------------------------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -------------------------------------------------------------------
      # 5. Install Node dependencies (Playwright)
      # -------------------------------------------------------------------
      - name: Install Node dependencies
        run: npm ci

      # -------------------------------------------------------------------
      # 6. Install Playwright browsers (Chromium + system deps)
      # -------------------------------------------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # -------------------------------------------------------------------
      # 7. Start the Flask app in the background
      #    Wait until it responds before running tests
      # -------------------------------------------------------------------
      - name: Start Flask app
        run: |
          python login_app/app.py &
          echo "Waiting for Flask to start..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/login > /dev/null; then
              echo "Flask is up!"
              break
            fi
            sleep 1
          done

      # -------------------------------------------------------------------
      # 8a. Run the chromium-desktop project
      #     Writes its own JUnit file. Includes the 3 intentional mobile
      #     failures (page.tap not supported on desktop).
      # -------------------------------------------------------------------
      - name: Run Playwright tests (chromium-desktop)
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/junit-chromium-desktop.xml
        run: npx playwright test --project=chromium-desktop
        continue-on-error: true

      # -------------------------------------------------------------------
      # 8b. Run the mobile-chrome project
      #     Writes its own JUnit file. Mobile tests pass here because the
      #     Pixel 5 device has touch support (page.tap works).
      # -------------------------------------------------------------------
      - name: Run Playwright tests (mobile-chrome)
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/junit-mobile-chrome.xml
        run: npx playwright test --project=mobile-chrome
        continue-on-error: true

      # -------------------------------------------------------------------
      # 9. Upload the HTML report as a downloadable artifact
      #    Always runs, even if tests failed
      # -------------------------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # -------------------------------------------------------------------
      # 10. Upload JUnit results (used later for TestRail push)
      # -------------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      # -------------------------------------------------------------------
      # 11. Install trcli once for both pushes
      # -------------------------------------------------------------------
      - name: Install trcli
        if: always()
        run: pip install trcli

      # -------------------------------------------------------------------
      # 12. Push chromium-desktop results to TestRail
      #     Each project pushes its own XML for full traceability.
      #     --case-matcher name matches tests to cases by TITLE.
      #     Credentials come from GitHub Secrets (never exposed in logs).
      # -------------------------------------------------------------------
      - name: Push chromium-desktop results to TestRail
        if: always()
        run: |
          trcli -y \
            -h "${{ secrets.TESTRAIL_HOST }}" \
            -u "${{ secrets.TESTRAIL_USER }}" \
            -k "${{ secrets.TESTRAIL_API_KEY }}" \
            --project "Login Page QA — Week 1 Practical" \
            --project-id 2 \
            parse_junit \
            --title "Playwright Run (chromium-desktop) - GitHub Actions" \
            --case-matcher name \
            --file "test-results/junit-chromium-desktop.xml"

      # -------------------------------------------------------------------
      # 13. Push mobile-chrome results to TestRail
      # -------------------------------------------------------------------
      - name: Push mobile-chrome results to TestRail
        if: always()
        run: |
          trcli -y \
            -h "${{ secrets.TESTRAIL_HOST }}" \
            -u "${{ secrets.TESTRAIL_USER }}" \
            -k "${{ secrets.TESTRAIL_API_KEY }}" \
            --project "Login Page QA — Week 1 Practical" \
            --project-id 2 \
            parse_junit \
            --title "Playwright Run (mobile-chrome) - GitHub Actions" \
            --case-matcher name \
            --file "test-results/junit-mobile-chrome.xml"
