<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — QA Practice App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    .card__logo { text-align: center; margin-bottom: 1.75rem; }
    .card__logo h1 { font-size: 1.4rem; color: #1a1a2e; }
    .card__logo p  { font-size: 0.85rem; color: #6b7280; margin-top: 0.25rem; }

    .alert {
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }
    .alert--error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert--success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .alert--info    { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }

    .form__group { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.35rem;
    }

    input[type="email"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #111827;
      min-height: 44px;
      transition: border-color .2s;
    }

    input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,.15);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      transition: background .2s;
    }

    .btn--primary { background: #4f46e5; color: #fff; }
    .btn--primary:hover { background: #4338ca; }

    .card__footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: #6b7280;
    }

    .card__footer a { color: #4f46e5; text-decoration: none; font-weight: 500; }
    .card__footer a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>

  <main class="card" role="main">

    <div class="card__logo">
      <h1>Forgot Password</h1>
      <p>Enter your email to receive a reset link</p>
    </div>

    <!-- Error message -->
    {% if error %}
      <div class="alert alert--error" id="error-message" role="alert">{{ error }}</div>
    {% endif %}

    <!-- TC_LOGIN_006: Neutral confirmation message — prevents email enumeration -->
    {% if message %}
      <div class="alert alert--info" id="reset-confirmation" role="status">
        {{ message }}
      </div>
      <div class="card__footer">
        <a href="{{ url_for('login') }}" id="back-to-login">&#8592; Back to login</a>
      </div>

    {% else %}

      <form method="POST" action="{{ url_for('forgot_password') }}" id="forgot-password-form">
        <div class="form__group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            aria-required="true"
          />
        </div>

        <button type="submit" class="btn btn--primary" id="send-reset-btn">
          Send Reset Link
        </button>
      </form>

      <div class="card__footer">
        <a href="{{ url_for('login') }}" id="back-to-login">&#8592; Back to login</a>
      </div>

    {% endif %}

  </main>

</body>
</html>
