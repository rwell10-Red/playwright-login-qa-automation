<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — QA Practice App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    .card__logo { text-align: center; margin-bottom: 1.75rem; }
    .card__logo h1 { font-size: 1.4rem; color: #1a1a2e; }
    .card__logo p  { font-size: 0.85rem; color: #6b7280; margin-top: 0.25rem; }

    .alert {
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }
    .alert--error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

    .form__group { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.35rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #111827;
      min-height: 44px;
      transition: border-color .2s;
    }

    input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,.15);
    }

    .hint {
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 0.3rem;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      transition: background .2s;
    }

    .btn--primary { background: #4f46e5; color: #fff; }
    .btn--primary:hover { background: #4338ca; }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>

  <main class="card" role="main">

    <div class="card__logo">
      <h1>Set New Password</h1>
      <p>Choose a strong password for your account</p>
    </div>

    {% if error %}
      <div class="alert alert--error" id="error-message" role="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('reset_password', token=token) }}" id="reset-password-form">
      <div class="form__group">
        <label for="password">New password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="new-password"
          aria-required="true"
        />
        <span class="hint">Minimum 8 characters</span>
      </div>

      <div class="form__group">
        <label for="confirm_password">Confirm new password</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="••••••••"
          autocomplete="new-password"
          aria-required="true"
        />
      </div>

      <button type="submit" class="btn btn--primary" id="reset-submit-btn">
        Update Password
      </button>
    </form>

  </main>

</body>
</html>
